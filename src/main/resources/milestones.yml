# CdrMoonFishing v1.0.8
# Hadiah milestone FishDex.
# Luck Koleksi bersifat permanen per-player setelah milestone tercapai.
# Bonus ini ditumpuk dengan luck joran, tetapi tidak melewati syarat ikan
# seperti waktu, cuaca, kedalaman, atau umpan wajib.

milestones:
  collection_25:
    display-name: "Penjelajah FishDex"
    type: COLLECTION_PERCENT
    target-percent: 25
    reward:
      money: 500.0
      bait-id: shrimp
      bait-amount: 3
      collection-luck: 0.01

  collection_50:
    display-name: "Kolektor FishDex"
    type: COLLECTION_PERCENT
    target-percent: 50
    reward:
      money: 1500.0
      bait-id: glow_worm
      bait-amount: 2
      collection-luck: 0.02

  collection_75:
    display-name: "Pemburu FishDex"
    type: COLLECTION_PERCENT
    target-percent: 75
    reward:
      money: 3000.0
      bait-id: moon_worm
      bait-amount: 2
      collection-luck: 0.03

  collection_100:
    display-name: "Master FishDex"
    type: COLLECTION_PERCENT
    target-percent: 100
    reward:
      money: 7500.0
      bait-id: ancient_bait
      bait-amount: 2
      collection-luck: 0.06

  first_legendary:
    display-name: "Penemuan Legendaris"
    type: FIRST_LEGENDARY
    reward:
      money: 2500.0
      bait-id: ancient_bait
      bait-amount: 1
      collection-luck: 0.03

