# CdrMoonFishing v0.9.5
# FishDex milestone rewards.
# Collection Luck is permanent per player once a milestone is claimed.
# It stacks with fishing rod rarity luck, but does not bypass fish requirements
# such as time, weather, depth or required bait.

milestones:
  collection_25:
    display-name: "FishDex Explorer"
    type: COLLECTION_PERCENT
    target-percent: 25
    reward:
      money: 500.0
      bait-id: shrimp
      bait-amount: 3
      rod-xp: 25
      collection-luck: 0.01

  collection_50:
    display-name: "FishDex Collector"
    type: COLLECTION_PERCENT
    target-percent: 50
    reward:
      money: 1500.0
      bait-id: glow_worm
      bait-amount: 2
      rod-xp: 50
      collection-luck: 0.02

  collection_75:
    display-name: "FishDex Hunter"
    type: COLLECTION_PERCENT
    target-percent: 75
    reward:
      money: 3000.0
      bait-id: moon_worm
      bait-amount: 2
      rod-xp: 100
      collection-luck: 0.03

  collection_100:
    display-name: "Master of the FishDex"
    type: COLLECTION_PERCENT
    target-percent: 100
    reward:
      money: 7500.0
      bait-id: ancient_bait
      bait-amount: 2
      rod-xp: 250
      collection-luck: 0.06

  first_legendary:
    display-name: "Legendary Discovery"
    type: FIRST_LEGENDARY
    reward:
      money: 2500.0
      bait-id: ancient_bait
      bait-amount: 1
      rod-xp: 150
      collection-luck: 0.03

