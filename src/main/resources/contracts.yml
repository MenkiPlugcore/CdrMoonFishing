# CdrMoonFishing v1.0.8 Kontrak Memancing Harian
# Tiga kontrak dipilih secara deterministik setiap hari.

settings:
  daily-count: 3
  timezone: "Asia/Jakarta"

contracts:
  rare_hunter:
    display-name: "Pemburu Ikan Langka"
    description: "Tangkap 5 ikan LANGKA atau lebih tinggi."
    progress-mode: COUNT
    target: 5
    conditions:
      min-rarity: RARE
    rewards:
      money: 750.0

  heavy_haul:
    display-name: "Tangkapan Berat"
    description: "Tangkap ikan dengan total berat 30 kg."
    progress-mode: WEIGHT
    target: 30.0
    conditions: {}
    rewards:
      money: 900.0

  moon_koi_night:
    display-name: "Koi di Bawah Bulan"
    description: "Tangkap 1 Koi Bulan pada malam hari."
    progress-mode: COUNT
    target: 1
    conditions:
      fish-id: "moon_koi"
      time: NIGHT
    rewards:
      money: 1200.0
      bait:
        id: "moon_worm"
        amount: 2

  shrimp_specialist:
    display-name: "Spesialis Umpan Udang"
    description: "Tangkap 3 ikan menggunakan Umpan Udang."
    progress-mode: COUNT
    target: 3
    conditions:
      bait-id: "shrimp"
    rewards:
      money: 650.0
      bait:
        id: "glow_worm"
        amount: 2

  deep_water_hunt:
    display-name: "Perburuan Laut Dalam"
    description: "Tangkap 3 ikan dari kedalaman 20 blok atau lebih."
    progress-mode: COUNT
    target: 3
    conditions:
      min-depth: 20
    rewards:
      money: 850.0

  storm_fisher:
    display-name: "Pemancing Badai"
    description: "Tangkap 2 ikan saat badai petir."
    progress-mode: COUNT
    target: 2
    conditions:
      weather: THUNDER
    rewards:
      money: 1000.0
      bait:
        id: "ancient_bait"
        amount: 1
