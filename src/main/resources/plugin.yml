name: CdrMoonFishing
version: ${version}
main: id.menki.cdrmoonfishing.CdrMoonFishing
api-version: '1.21'
author: Cadera
description: Crossplay-first custom fishing progression for Java and Bedrock players.
softdepend:
  - Vault
  - ItemsAdder
  - MMOItems
  - Citizens
  - floodgate
  - Geyser-Spigot
commands:
  cdrfish:
    description: Open the CdrMoonFishing main hub
    usage: /cdrfish
    aliases: [fish]
  fishing:
    description: Main CdrMoonFishing command
    usage: /fishing [bait|stats|givebait|reload|debug|status|cancel]
    aliases: [moonfishing, cmf]
  fishdex:
    description: Open the FishDex GUI
    usage: /fishdex [page]
    aliases: [fdex]
  fishmarket:
    description: Travel to and manage the CdrMoonFishing Fish Market
    usage: /fishmarket [warp|price|featured|setspawn|delspawn|bind|unbind|bindings|open]
    aliases: [fmarket, fishshop]
  fishtournament:
    description: Open or manage fishing tournaments
    usage: /fishtournament [status|top|start|stop|cancel]
    aliases: [ftourney, ftournament]
  fishleaderboard:
    description: Open lifetime fishing leaderboards
    usage: /fishleaderboard [catches|weight|biggest|legendary] [page]
    aliases: [flb, fishlb]
  fishrod:
    description: View and manage CdrMoonFishing progression rods and Fishing Supply
    usage: /fishrod [info|tiers|give|supply]
    aliases: [frod, fishingrod]
  fishcontracts:
    description: View daily fishing contracts
    usage: /fishcontracts [reload|reset]
    aliases: [fcontracts, fishingcontracts, fq]
  fishmilestones:
    description: View FishDex collection milestones and rewards
    usage: /fishmilestones [status|reload|reset]
    aliases: [fmilestones, fishdexrewards, fdrewards]
  fishdoctor:
    description: Run CdrMoonFishing production diagnostics
    usage: /fishdoctor
    aliases: [fdoctor, fishingdoctor]
permissions:
  cdrmoonfishing.admin:
    description: Access to CdrMoonFishing administration commands
    default: op
