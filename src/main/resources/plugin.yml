name: CdrMoonFishing
version: ${version}
main: id.menki.cdrmoonfishing.CdrMoonFishing
api-version: '1.21'
author: Cadera
description: Crossplay-first custom fishing gameplay for Java and Bedrock players.
softdepend:
  - Vault
  - ItemsAdder
  - MMOItems
  - floodgate
  - Geyser-Spigot
commands:
  fishing:
    description: Main CdrMoonFishing command
    usage: /fishing [bait|stats|givebait|reload|debug|status|cancel]
    aliases: [moonfishing, cmf]
  fishdex:
    description: Open your CdrMoonFishing FishDex
    usage: /fishdex [page]
    aliases: [fdex]
  fishmarket:
    description: Open the CdrMoonFishing fish market
    usage: /fishmarket [open|price|sellhand|sellall|featured]
    aliases: [fmarket, fishshop]
permissions:
  cdrmoonfishing.admin:
    description: Access to CdrMoonFishing administration commands
    default: op
