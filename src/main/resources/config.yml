# CdrMoonFishing v1.0.4
# Missing keys are merged automatically on startup/reload.
config-version: 1

minigame:
  tick-period: 5
  start-tension: 50.0
  perfect-min: 35.0
  perfect-max: 70.0
  danger-low: 5.0
  danger-high: 95.0
  danger-grace-ticks: 8
  reel-power: 7.5
  reel-cooldown-ms: 180
  slack-per-tick: 2.0
  progress-per-safe-tick: 4.0
  progress-loss-outside: 1.5
  timeout-seconds: 25

# Visual encounter HUD. The bar remains fully visible while a bright marker
# moves across danger / warning / safe zones, so players do not need to rely
# on percentages alone. Standard Adventure Action Bar = Java + Bedrock safe.
ui:
  action-bar:
    enabled: true
    segments: 24
    segment: "▬"
    marker: "◆"
    show-tension-percent: true
    show-catch-progress: true
    show-state: false

behavior:
  erratic-surge-chance: 0.18
  erratic-surge-min: 2.5
  erratic-surge-max: 5.5
  aggressive-surge-chance: 0.14
  aggressive-surge-min: 3.5
  aggressive-surge-max: 7.0
  diving-surge-every-ticks: 8
  diving-surge-min: 5.0
  diving-surge-max: 8.0

economy:
  enabled: true
  global-multiplier: 1.0
  minimum-price: 1.0
  rarity-multipliers:
    COMMON: 1.0
    UNCOMMON: 1.10
    RARE: 1.30
    EPIC: 1.65
    LEGENDARY: 2.25
  market:
    featured-enabled: true
    featured-multiplier: 1.35
    timezone: "Asia/Jakarta"

# Catch IDs are added to new v1.0 catches. The redemption ledger blocks
# copied/duplicated catches from being sold more than once.
security:
  market:
    # false keeps pre-v1.0 fish sellable. Set true after legacy stock is gone.
    require-catch-uid: false

tournament:
  points:
    weight-multiplier: 0.25
    rarity:
      COMMON: 1.0
      UNCOMMON: 3.0
      RARE: 8.0
      EPIC: 20.0
      LEGENDARY: 60.0
  rewards:
    enabled: true
    first: 5000.0
    second: 2500.0
    third: 1000.0

messages:
  bite-common: "Something is biting..."
  bite-unusual: "Something unusual is biting..."
  bite-legendary: "Something HUGE took the bait..."
  encounter-start: "FISH ON! Keep the line under control."
  escaped: "The fish escaped."
  market-duplicate-blocked: "This catch identity has already been redeemed."
