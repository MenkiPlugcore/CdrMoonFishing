# CdrMoonFishing v0.5.0
# Crossplay-first: gameplay and market UI use normal server-side interactions.

minigame:
  tick-period: 5
  start-tension: 50.0
  perfect-min: 35.0
  perfect-max: 70.0
  danger-low: 5.0
  danger-high: 95.0
  danger-grace-ticks: 8
  reel-power: 7.5
  reel-cooldown-ms: 180
  slack-per-tick: 2.0
  progress-per-safe-tick: 4.0
  progress-loss-outside: 1.5
  timeout-seconds: 25

behavior:
  erratic-surge-chance: 0.18
  erratic-surge-min: 2.5
  erratic-surge-max: 5.5
  aggressive-surge-chance: 0.14
  aggressive-surge-min: 3.5
  aggressive-surge-max: 7.0
  diving-surge-every-ticks: 8
  diving-surge-min: 5.0
  diving-surge-max: 8.0

economy:
  enabled: true
  global-multiplier: 1.0
  minimum-price: 1.0
  rarity-multipliers:
    COMMON: 1.0
    UNCOMMON: 1.10
    RARE: 1.30
    EPIC: 1.65
    LEGENDARY: 2.25
  market:
    featured-enabled: true
    featured-multiplier: 1.35
    timezone: "Asia/Jakarta"

messages:
  bite-common: "Something is biting..."
  bite-unusual: "Something unusual is biting..."
  bite-legendary: "Something HUGE took the bait..."
  encounter-start: "FISH ON! Keep tension between 35% and 70%."
  escaped: "The fish escaped."
