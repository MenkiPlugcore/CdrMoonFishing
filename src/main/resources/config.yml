# CdrMoonFishing v1.3.0
# Key yang belum ada akan digabung otomatis saat startup/reload.
config-version: 4

minigame:
  tick-period: 5
  start-tension: 50.0
  perfect-min: 35.0
  perfect-max: 70.0
  danger-low: 5.0
  danger-high: 95.0
  danger-grace-ticks: 8

  # Input player selalu mendorong marker ke kanan.
  reel-power: 7.5
  reel-cooldown-ms: 180

  # Semua gerakan otomatis ikan hanya menarik marker ke kiri.
  slack-per-tick: 2.0
  fish-pull-scale: 0.55

  progress-per-safe-tick: 4.0
  progress-loss-outside: 1.5
  timeout-seconds: 25

ui:
  action-bar:
    enabled: true
    segments: 20
    prefix: "🎣 "
    left-frame: "["
    right-frame: "]"
    safe-segment: "█"
    warning-segment: "▒"
    danger-segment: "░"
    marker: "│"
    show-tension-percent: false
    show-catch-progress: true
    show-state: false

behavior:
  surge-scale: 0.55
  erratic-surge-chance: 0.18
  erratic-surge-min: 2.5
  erratic-surge-max: 5.5
  aggressive-surge-chance: 0.14
  aggressive-surge-min: 3.5
  aggressive-surge-max: 7.0
  diving-surge-every-ticks: 8
  diving-surge-min: 5.0
  diving-surge-max: 8.0

# v1.3.0 — Fishing Fever
# Admin dapat menyalakan buff global sementara dengan:
# /fishevent start 2x 30m
# /fishevent start 4x 20m
# /fishevent start 8x 10m
#
# Angka x adalah intensitas luck, BUKAN pengali berat mentah. Berat tangkapan
# tetap dibatasi min-weight/max-weight spesies, hanya distribusinya condong ke
# ikan yang lebih besar.
fishing-event:
  # Seberapa besar setiap rarity menikmati intensitas event.
  # Rumus: 1 + ((eventMultiplier - 1) * strength)
  rarity-strength:
    COMMON: 0.00
    UNCOMMON: 0.15
    RARE: 0.45
    EPIC: 0.75
    LEGENDARY: 1.00

  # 1.0 = x2/x4/x8 memakai intensitas penuh untuk bias berat.
  # Turunkan ke 0.5 jika ikan besar terlalu sering muncul.
  big-fish-power-scale: 1.0

economy:
  enabled: true
  global-multiplier: 1.0
  minimum-price: 1.0
  rarity-multipliers:
    COMMON: 1.0
    UNCOMMON: 1.10
    RARE: 1.30
    EPIC: 1.65
    LEGENDARY: 2.25
  market:
    featured-enabled: true
    featured-multiplier: 1.35
    timezone: "Asia/Jakarta"

security:
  market:
    require-catch-uid: false

tournament:
  points:
    weight-multiplier: 0.25
    rarity:
      COMMON: 1.0
      UNCOMMON: 3.0
      RARE: 8.0
      EPIC: 20.0
      LEGENDARY: 60.0
  rewards:
    enabled: true
    first: 5000.0
    second: 2500.0
    third: 1000.0

messages:
  bite-common: "Ada ikan yang menyambar..."
  bite-unusual: "Ada sesuatu yang tidak biasa menyambar..."
  bite-legendary: "SESUATU YANG BESAR memakan umpannya..."
  encounter-start: "IKAN TERSANGKUT! Jaga tarikan senar."
  escaped: "Ikannya lepas."
  market-duplicate-blocked: "Identitas tangkapan ini sudah pernah dijual."
