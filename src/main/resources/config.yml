# CdrMoonFishing v1.2.1
# Key yang belum ada akan digabung otomatis saat startup/reload.
config-version: 3

minigame:
  tick-period: 5
  start-tension: 50.0
  perfect-min: 35.0
  perfect-max: 70.0
  danger-low: 5.0
  danger-high: 95.0
  danger-grace-ticks: 8

  # Input player selalu mendorong marker ke kanan.
  reel-power: 7.5
  reel-cooldown-ms: 180

  # v1.2.1: semua gerakan otomatis ikan hanya menarik marker ke kiri.
  # slack-per-tick = tarikan kiri dasar saat player tidak menekan reel.
  # fish-pull-scale = skala pull-min/pull-max tiap spesies agar tetap nyaman di Bedrock.
  slack-per-tick: 2.0
  fish-pull-scale: 0.55

  progress-per-safe-tick: 4.0
  progress-loss-outside: 1.5
  timeout-seconds: 25

# HUD lane satu baris. Marker bergerak di jalur tetap sementara zona
# aman / peringatan / bahaya selalu terlihat.
ui:
  action-bar:
    enabled: true
    segments: 20
    prefix: "🎣 "
    left-frame: "["
    right-frame: "]"
    safe-segment: "█"
    warning-segment: "▒"
    danger-segment: "░"
    marker: "│"
    show-tension-percent: false
    show-catch-progress: true
    show-state: false

behavior:
  # Semua surge adalah tambahan tarikan ke KIRI. Tidak ada behavior yang
  # mendorong marker ke kanan; kanan hanya berasal dari input reel player.
  surge-scale: 0.55

  erratic-surge-chance: 0.18
  erratic-surge-min: 2.5
  erratic-surge-max: 5.5
  aggressive-surge-chance: 0.14
  aggressive-surge-min: 3.5
  aggressive-surge-max: 7.0
  diving-surge-every-ticks: 8
  diving-surge-min: 5.0
  diving-surge-max: 8.0

economy:
  enabled: true
  global-multiplier: 1.0
  minimum-price: 1.0
  rarity-multipliers:
    COMMON: 1.0
    UNCOMMON: 1.10
    RARE: 1.30
    EPIC: 1.65
    LEGENDARY: 2.25
  market:
    featured-enabled: true
    featured-multiplier: 1.35
    timezone: "Asia/Jakarta"

# Catch ID diberikan pada tangkapan baru. Ledger penjualan mencegah
# hasil duplikasi dengan ID yang sama dijual lebih dari sekali.
security:
  market:
    # false = ikan lama sebelum v1.0 masih dapat dijual.
    require-catch-uid: false

tournament:
  points:
    weight-multiplier: 0.25
    rarity:
      COMMON: 1.0
      UNCOMMON: 3.0
      RARE: 8.0
      EPIC: 20.0
      LEGENDARY: 60.0
  rewards:
    enabled: true
    first: 5000.0
    second: 2500.0
    third: 1000.0

messages:
  bite-common: "Ada ikan yang menyambar..."
  bite-unusual: "Ada sesuatu yang tidak biasa menyambar..."
  bite-legendary: "SESUATU YANG BESAR memakan umpannya..."
  encounter-start: "IKAN TERSANGKUT! Jaga tarikan senar."
  escaped: "Ikannya lepas."
  market-duplicate-blocked: "Identitas tangkapan ini sudah pernah dijual."
