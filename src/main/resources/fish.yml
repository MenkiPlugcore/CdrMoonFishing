# Registry ikan CdrMoonFishing
#
# v1.1.0 membawa 25 spesies default. Instalasi lama akan menerima spesies baru
# secara aman tanpa menimpa konfigurasi ikan yang sudah pernah diedit owner.
#
# Provider item custom bersifat opsional. `material` selalu menjadi fallback vanilla yang aman.
# Tambahkan blok ini pada ikan ketika asetnya sudah siap:
#
# item:
#   provider: AUTO              # VANILLA | ITEMSADDER | MMOITEMS | AUTO
#   itemsadder-id: "moonfishing:moon_koi"
#   mmoitems-type: "MATERIAL"
#   mmoitems-id: "MOON_KOI"
#   preserve-provider-name: true
#   preserve-provider-lore: true
#
# AUTO mencoba ItemsAdder, lalu MMOItems, lalu kembali ke `material`.

